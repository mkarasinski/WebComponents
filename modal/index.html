<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web component</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 2rem;
      font-family: sans-serif;
    }
  </style>
  <script src="modal.js"></script>
</head>

<body>
  <mk-modal>
    <h1 slot="title">Please Confirm payment</h1>
    <p slot="main">With your confirmation you agree to pay the full amount!</p>
  </mk-modal>
  <p>Please confirm your choice.</p>
  <button>Show Details & Confirm</button>

  <script>
    const confirmButton = document.querySelector('button');
    const modal = document.querySelector('mk-modal');
    
    confirmButton.addEventListener('click', () => {
      modal.open();
    });

    modal.addEventListener('confirm', () => {
      console.log('confirmed...');
    });

    modal.addEventListener('cancel', () => {
      console.log('canceled...');
    })
  </script>
</body>

</html>
